    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="left-navbar">
        <a href="#" class="back-arrow">‹</a>

        <div class="logo">
            <img src="../img/Designer (16).png" alt="NearCare">

    </div>

    <div class="role">Doctor</div>

    <div class="welcome">

<div class="circle circle1"></div>

<div class="form-container">

    <div class="image-side">
        <img src="img/doctor.png" alt="Doctor">
    </div>

    <div class="form-side">

        <h2>REGISTRO DOCTOR</h2>

        <form action="register.php" method="POST">

            <input type="text" name="nombre" placeholder="Nombre completo" required>

            <input type="email" name="correo" placeholder="Correo electrónico" required>

            <input type="text" name="especialidad" placeholder="Especialidad" required>

            <input type="text" name="telefono" placeholder="Teléfono">

            <input type="password" name="password" placeholder="Contraseña" required>

            <input type="password" name="confirmar_password" placeholder="Confirmar contraseña" required>

            <p>
                ¿Ya tienes cuenta?
                <a href="login.html">Inicia sesión</a>
            </p>

            <button type="submit">
                Registrarme
            </button>

        </form>

    </div>

</div>
