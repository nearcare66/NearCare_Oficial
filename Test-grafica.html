<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gráfica de pastel</title>

  <!-- ✅ CDN CORRECTO -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      background: transparent;
    }

    canvas {
      background: transparent;
    }
  </style>
</head>
<body>

<canvas id="miGráfica"></canvas>

<script>
const ctx = document.getElementById('miGrafica').getContext('2d');

new Chart(ctx, {
    type: 'pie',
    data: {
        labels: ['Rojo', 'Azul', 'Amarillo'],
        datasets: [{
            data: [10, 20, 30],
            backgroundColor: [
                'rgba(255, 99, 132, 0.7)',
                'rgba(54, 162, 235, 0.7)',
                'rgba(255, 206, 86, 0.7)'
            ],
            borderWidth: 0
        }]
    },
    options: {
        plugins: {
            legend: {
                labels: {
                    color: '#000'
                }
            }
        }
    }
});
</script>

</body>
</html>
